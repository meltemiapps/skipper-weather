name: TestFlight
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  ship:
    # The Mac mini self-hosted runner (register one for this repo, as for Aeolet).
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ship-testflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: build/*.log, if-no-files-found: ignore }
